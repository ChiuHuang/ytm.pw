name: Build IPA from your own YTM IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to your decrypted YTM 9.34 .ipa"
        required: true
      version:
        description: "Mod version label"
        required: false
        default: "0.1.0"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Fetch decrypted IPA (link masked, artifact stays in this fork)
        run: |
          mkdir -p ipa
          curl -sL "${{ inputs.ipa_url }}" -o ipa/ytm-decrypted.ipa
          ls -la ipa/

      - name: Layer check + build tweak
        run: |
          ./scripts/check-layers.sh
          gmake -C tweak package

      - name: Inject tweak into IPA (cyan)
        run: |
          uv tool install "cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw"
          mkdir -p out
          # Flags follow cyan's README; adjust here if its CLI moves.
          cyan -i ipa/ytm-decrypted.ipa -o out/ytm.pw-unsigned.ipa -f tweak/packages/*.deb
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: ytm-pw-unsigned-ipa
          path: out/ytm.pw-unsigned.ipa
